<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  ORGANIZATION ||--o{ PROJECT : has
  PROJECT ||--o{ PROJECT_MEMBER : has
  PROJECT ||--o{ CONTENT_TYPE : defines
  PROJECT ||--o{ STORAGE : has
  PROJECT ||--o{ RESOURCE : has
  CONTENT_TYPE ||--o{ CONTENT : instances
  STORAGE ||--o{ RESOURCE : stores
  RESOURCE ||--o{ RESOURCE_VERSION : versions
  RESOURCE_VERSION ||--o{ INSPECTION : results
  CONTENT_TYPE }o--o{ INSPECTOR_CONFIGURATION : configures
  INSPECTOR_CONFIGURATION }o--|| INSPECTOR : uses
  TAG_CATEGORY ||--o{ TAG : groups
  TAG ||--o{ TAG_LINK : links
  CONTENT ||--o{ TAG_LINK : tagged
  CONTENT ||--o{ ASSET_LINK : linked
  ASSET_LINK }o--|| ASSET : references

  ORGANIZATION {
    uuid id PK
    string name
  }
  PROJECT {
    uuid id PK
    uuid org_id FK
    string name
  }
  PROJECT_MEMBER {
    uuid user_id FK
    uuid project_id FK
    string role
  }
  CONTENT_TYPE {
    uuid id PK
    uuid project_id FK
    string key
    jsonb fields_config
  }
  CONTENT {
    uuid id PK
    uuid content_type_id FK
    jsonb values
  }
  STORAGE {
    uuid id PK
    uuid project_id FK
    string kind
    string root_path
  }
  RESOURCE {
    uuid id PK
    uuid project_id FK
    uuid storage_id FK
    string path
  }
  RESOURCE_VERSION {
    uuid id PK
    uuid resource_id FK
    int version_no
  }
  INSPECTOR {
    uuid id PK
    string key
    string extension
    string script_path
  }
  INSPECTOR_CONFIGURATION {
    uuid id PK
    uuid content_type_id FK
    string inspector_key
    string relevant_field_path
  }
  INSPECTION {
    uuid id PK
    uuid resource_version_id FK
    string inspector_key
    jsonb result_json
  }
  TAG_CATEGORY {
    uuid id PK
    string applies_to
  }
  TAG {
    uuid id PK
    uuid tag_category_id FK
    string name
  }
  TAG_LINK {
    uuid tag_id FK
    string entity_type
    uuid entity_id
  }
  ASSET {
    uuid id PK
    string path
    string sha256_hash
  }
  ASSET_LINK {
    uuid asset_id FK
    string entity_type
    uuid entity_id
    string slot
  }`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
